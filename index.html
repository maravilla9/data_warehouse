<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director comercial por un día | Semana 3</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#07B708; --verde-d:#058A06; --tinta:#1F2433; --suave:#6B7280; --fondo:#F4F7F2;
  --naranja:#F07B00; --rosa:#D6338A; --turq:#0E9C94; --morado:#7B2FD0; --amarillo:#E0A100; --azul:#2E7DD7; --rojo:#D62828;
  --noche:#101A2E; --noche2:#1A2742;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px}
body{font-size:15px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{height:38px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;color:#fff}
.b1{background:var(--rosa)} .b2{background:var(--morado)}
.top{display:flex;gap:10px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.timer{font-weight:700;background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:160px;height:12px;background:#E3E8E0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--turq));transition:width .6s}
.steps{display:none;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.steps span{flex:1;min-width:92px;text-align:center;font-size:11.5px;font-weight:700;padding:5px 4px;border-radius:10px;background:#E6EAE3;color:#8A9187;transition:all .3s}
.steps span.on{background:var(--morado);color:#fff;transform:translateY(-2px)}
.steps span.ok{background:#DDF5DD;color:var(--verde-d)}
.card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 6px 24px rgba(16,26,46,.08);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:28px;margin:0 0 6px;line-height:1.2}
h2{font-size:20px;margin:0 0 4px}
.mis{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
p{line-height:1.5;margin:6px 0}
.story{background:#FFF4E6;border-left:5px solid var(--naranja);border-radius:12px;padding:12px 14px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--noche);color:#fff;border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:24px}
.kpi small{color:#AFC0DA}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid #D6DCD2;border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--verde)}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:var(--verde);color:#fff;transition:transform .1s,background .2s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.97)} .btn:hover{background:var(--verde-d)}
.btn.sec{background:#EEF1EC;color:var(--tinta)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:14px;display:none}
.msg.ojo{display:block;background:#FDE8E8;color:#8E1B1B;border-left:5px solid var(--rojo)}
.msg.bien{display:block;background:#E3F7E3;color:#145A14;border-left:5px solid var(--verde)}
/* extracción */
.extract{display:grid;grid-template-columns:1fr 160px;gap:14px;align-items:center;margin-top:10px}
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.src{border:2px solid #D6DCD2;background:#fff;border-radius:14px;padding:12px;cursor:pointer;font:inherit;font-size:14px;text-align:left;display:flex;gap:10px;align-items:center;transition:all .15s}
.src .ic{font-size:26px}
.src{position:relative}
.src.sel{border-color:var(--morado);background:#EDE3FA}
.src.sel::after{content:"✔";position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:var(--morado);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.src.bad::after{content:"✖";background:var(--rojo)}
.cnt{font-weight:700;color:var(--morado);margin-top:10px}
.src.bad{border-color:var(--rojo);background:#FDE8E8}
.cube{width:130px;height:130px;border-radius:24px;background:linear-gradient(145deg,#7B2FD0,#2E7DD7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-align:center;box-shadow:0 10px 30px rgba(123,47,208,.35);position:relative;overflow:hidden}
.cube .big{font-size:48px;line-height:1}
.cube .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(7,183,8,.55);transition:height 2.4s ease}
.cube > *{position:relative;z-index:1}
.dot{position:fixed;width:14px;height:14px;border-radius:50%;z-index:40;pointer-events:none;transition:all .9s cubic-bezier(.5,0,.3,1)}
/* elaboración */
.belt{background:repeating-linear-gradient(90deg,#2B3753 0 20px,#24304A 20px 40px);border-radius:14px;padding:14px;margin-top:12px;animation:beltmove 1.2s linear infinite}
@keyframes beltmove{from{background-position:0 0}to{background-position:40px 0}}
.rec{background:#fff;border-radius:12px;padding:12px;font-size:14px;border-left:6px solid var(--rojo);animation:slidein .45s ease}
.rec.clean{border-left-color:var(--verde);background:#EAF9EA}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.rec code{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:#FDE8E8;padding:2px 6px;border-radius:6px}
.rec.clean code{background:#DDF5DD}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:2px solid #D6DCD2;background:#fff;border-radius:12px;padding:9px 13px;font:inherit;font-size:14.5px;cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--morado)}
.opt.sel{border-color:var(--verde);background:#EAF9EA}
.opt.pick{border-color:var(--morado);background:#EDE3FA;box-shadow:0 0 0 3px rgba(123,47,208,.15)}
.opt.pick::before{content:"👉 "}
.guia{background:#E8F1FD;border-left:5px solid var(--azul);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;color:#1E3F6E}
.guia b{color:#123058}
.sim .guia{background:#16304F;color:#CFE0F7;border-left-color:#5AA2F0}.sim .guia b{color:#fff}
.sim .opt.pick{background:#2A2350;border-color:#A77BFF}
/* carga */
.counter{font-size:34px;font-weight:800;color:var(--morado);text-align:center;font-variant-numeric:tabular-nums}
/* explotación */
.dash{background:var(--noche);color:#fff;border-radius:18px;padding:16px;margin-top:12px}
.qbtns{display:grid;gap:8px}
.qb{font:inherit;font-size:14px;font-weight:600;text-align:left;background:var(--noche2);color:#fff;border:2px solid #2E3D5E;border-radius:12px;padding:10px 12px;cursor:pointer;transition:all .15s}
.qb:hover{border-color:var(--verde)}
.qb.done{border-color:var(--verde);background:#123A22}
.sql{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#0A1222;color:#7CFC8A;border-radius:10px;padding:10px;margin:12px 0;min-height:66px;white-space:pre-wrap}
.sql .cur{display:inline-block;width:8px;background:#7CFC8A;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.chart{display:grid;gap:8px}
.chart .r{display:grid;grid-template-columns:110px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.chart .t{height:20px;background:#22304D;border-radius:6px;overflow:hidden}
.chart .t i{display:block;height:100%;width:0;border-radius:6px;transition:width 1.1s ease}
.chart .v{text-align:right;font-weight:700}
.insight{margin-top:10px;background:#1E3A28;border-radius:10px;padding:8px 12px;font-size:14px;color:#BFF5C3;display:none}
/* oltp olap */
.flash{background:#F7F8FB;border-radius:16px;padding:14px;font-size:17px;font-weight:600;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{padding:12px}
.oltp{background:var(--naranja)} .oltp:hover{background:#C96500}
.olap{background:var(--morado)} .olap:hover{background:#6122AD}
/* simulador */
.sim{background:var(--noche);color:#fff;border-radius:18px;padding:16px 18px}
.simtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.money{font-size:24px;font-weight:800;color:#7CFC8A;font-variant-numeric:tabular-nums}
.alert{background:#2A1620;border:2px solid var(--rosa);border-radius:14px;padding:10px 14px;margin:10px 0;animation:pulse 1.4s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,51,138,.6)}50%{box-shadow:0 0 0 10px rgba(214,51,138,0)}}
.alert .hd{font-size:12px;font-weight:800;color:#FF9BCB;letter-spacing:.06em}
.hint{background:var(--noche2);border-radius:12px;padding:8px 12px;font-size:14px;color:#BFD0EA;margin-bottom:6px}
.sim .opt{background:var(--noche2);color:#fff;border-color:#2E3D5E}
.sim .opt:hover{border-color:var(--verde)}
.sim .msg.ojo{background:#3A1A1A;color:#FFC9C9}
.sim .msg.bien{background:#123A22;color:#BFF5C3}
/* resultado */
.cmp{display:grid;gap:12px;margin:16px 0}
.cmp .r{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;font-size:14px;font-weight:600}
.cmp .t{height:34px;background:#EEF1EC;border-radius:10px;overflow:hidden}
.cmp .t i{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;height:100%;width:0;color:#fff;font-weight:800;border-radius:10px;transition:width 1.4s ease;white-space:nowrap}
.cert{border:4px solid var(--verde);border-radius:20px;padding:22px;text-align:center;background:linear-gradient(180deg,#fff,#F2FBF2)}
.cert .nm{font-size:28px;font-weight:800;color:var(--morado);margin:6px 0}
.cert .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.cert .meta span{background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.share{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.share .btn{font-size:14px;padding:11px}
.wa{background:#25D366}.fb{background:#1877F2}.xx{background:#111}.cp{background:var(--turq)}.st{background:var(--rosa)}
.chat{margin-top:14px;font-weight:700;color:var(--verde-d);text-align:center}
footer{text-align:center;color:var(--suave);font-size:13px;margin:14px 0 8px}
.why{font-style:italic;color:#6B7280;font-size:13.5px;margin-top:6px;line-height:1.45}
.sim .why{color:#C9B9C9}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:600px){
  h1{font-size:23px}.card{padding:16px}
  .extract{grid-template-columns:1fr}.cube{margin:0 auto}
  .sources{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:18px}
  .chart .r{grid-template-columns:84px 1fr 54px}
  .cmp .r{grid-template-columns:1fr}
}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
let nombre = '', t0 = 0, tick = null, segundos = 0, ventas = 0;

/* ---------- sonido ---------- */
let ac;
function tono(f, d = .12, tipo = 'sine', v = .15, delay = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + delay;
    o.start(t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.stop(t + d + .02);
  } catch (e) {}
}
const sOk = () => { tono(660); tono(880, .15, 'sine', .15, .1); };
const sErr = () => tono(220, .25, 'square', .08);
const sWin = () => [523, 659, 784, 1047].forEach((f, i) => tono(f, .2, 'triangle', .15, i * .12));
const sAlert = () => [0, .25].forEach(d => tono(760, .15, 'square', .06, d));
const sCash = () => { tono(1200, .06, 'square', .06); tono(1600, .1, 'sine', .1, .06); };

/* ---------- confeti ---------- */
const cv = $('#conf'), cx = cv.getContext('2d'); let piezas = [];
function confeti(n = 170) {
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100', '#2E7DD7'];
  const vacio = !piezas.length;
  for (let i = 0; i < n; i++) piezas.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, c: cols[i % cols.length], a: Math.random() * 6 });
  if (vacio) requestAnimationFrame(caer);
}
function caer() {
  cx.clearRect(0, 0, cv.width, cv.height);
  piezas.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-4, -2, 8 + p.r, 4); cx.restore(); });
  piezas = piezas.filter(p => p.y < cv.height + 20);
  if (piezas.length) requestAnimationFrame(caer); else cx.clearRect(0, 0, cv.width, cv.height);
}

  const m = $('#m');
  const pinta = () => { m.className = 'msg'; $('#bp').disabled = $('#ba').disabled = false; $('#fl').innerHTML = `${C[k][0]}<small style="color:var(--suave);font-weight:400;font-size:13px">Situación ${k + 1} de ${C.length}</small>`; };
  const r = v => {
    if (v !== C[k][1]) return msg(m, 'ojo', 'Ojo: ' + C[k][2] + ' Toca la otra opción.');
    $('#bp').disabled = $('#ba').disabled = true; k++;
    if (k < C.length) { msg(m, 'bien', '✅ ' + C[k - 1][2] + '<div class="row"><button class="btn" id="nx">Siguiente situación ➜</button></div>'); return $('#nx').onclick = pinta; }
    msg(m, 'bien', '✅ ' + C[k - 1][2] + '<div class="row"><button class="btn" id="nx">Siguiente: etapa 6, ¡Empieza el Black Friday! 🛒</button></div>');
    $('#nx').onclick = buenFin;
  };
  $('#bp').onclick = () => r('p'); $('#ba').onclick = () => r('a');
  pinta();
}

/* ---------- 6. Simulador Black Friday ---------- */
function buenFin() {
  etapa(5);
  ventas = 0;
  const A = [
    { dia: 'Viernes · 8:00 am', t: 'Abrieron las tiendas. Tienes <b>600 pantallas</b> en el almacén central. ¿Cómo las repartes?',
      hint: 'Tablero: Monterrey se quedó sin pantallas en 11 h; Puebla no las acabó en 4 días.',
      o: [['Más pantallas a Monterrey y CDMX Norte, menos a Puebla', 2100000, null],
          ['Las mismas pantallas a todas las tiendas', 900000, 'Repartir igual es decidir "a ojo". Monterrey se volverá a quedar sin pantallas y en Puebla sobrarán.'],
          ['Todas a Puebla, que es la que más tiene en bodega', 300000, 'Puebla tiene muchas porque no las vende. Los datos dicen que la demanda está en Monterrey.']] },
    { dia: 'Sábado · 9:00 pm', t: 'Te sobra presupuesto para una oferta relámpago de audífonos. ¿Dónde y cuándo la lanzas?',
      hint: 'Tablero: la mayoría de los audífonos se compran en la app por la noche.',
      o: [['En la app, esta noche', 1300000, null],
          ['En las tiendas, mañana temprano', 400000, 'En las mañanas es cuando menos audífonos se venden en tienda.'],
          ['En un anuncio de radio la próxima semana', 100000, 'El Black Friday ya habrá terminado. La información sirve si llega a tiempo.']] },
    { dia: 'Domingo · 12:00 pm', t: '⚠️ Alerta del sistema: "Quedan 40 pantallas en CDMX Norte y se venden 15 por hora". ¿Qué haces?',
      hint: 'Tablero: CDMX Norte se agotó en 18 h el año pasado. Puebla todavía tiene pantallas.',
      o: [['Mover pantallas de Puebla a CDMX Norte hoy mismo', 1500000, null],
          ['Esperar al reporte del lunes', 200000, 'Para el lunes ya estará agotada. Por eso existe la alerta: para decidir a tiempo.'],
          ['Subir el precio para que se vendan más lento', 500000, 'Se venderían menos y los clientes se irían con la competencia. Hay inventario disponible en Puebla.']] },
    { dia: 'Lunes · 10:00 am', t: 'Último día. El área de Compras pregunta qué pedir para diciembre. ¿Qué le recomiendas?',
      hint: 'Tablero: pantallas y audífonos fueron lo más vendido; las consolas, lo que menos.',
      o: [['Pedir más pantallas y audífonos según los datos de 3 años', 1100000, null],
          ['Pedir más consolas porque "siempre se venden en diciembre"', 300000, 'Es una corazonada. Los datos dicen que las consolas fueron lo que menos se vendió.'],
          ['Pedir lo mismo que el año pasado', 600000, 'Repetir sin analizar ignora lo que aprendiste en este Black Friday.']] },
  ];
  let k = 0;
  app.innerHTML = `
  <section class="sim card">
    <div class="simtop"><span class="mis" style="color:#FF9BCB">🔴 En vivo · Black Friday</span><span class="money" id="money">$0</span></div>
    <div id="al"></div>
    <div class="msg" id="m"></div>
  </section>`;
  const m = $('#m');
  const sube = (de, a) => {
    const ini = Date.now();
    const it = setInterval(() => {
      const p = Math.min((Date.now() - ini) / 900, 1);
      if (!$('#money')) return clearInterval(it);
      $('#money').textContent = pesos(Math.floor(de + (a - de) * p));
      if (p === 1) clearInterval(it);
    }, 40);
  };
  const pinta = () => {
    const a = A[k]; sAlert(); m.className = 'msg';
    const ops = a.o.map((o, i) => [o, i]).sort(() => Math.random() - .5);
    $('#al').innerHTML = `<div class="alert"><div class="hd">${a.dia} · Decisión ${k + 1} de ${A.length}</div><p style="font-size:16px;margin:4px 0 0">${a.t}</p></div>
      <div class="hint">📊 ${a.hint}</div>
      ${guia('Lee la alerta, revisa el dato del tablero, elige una decisión y presiona <b>«Confirmar decisión»</b>.')}
      <div class="opts" id="so">${ops.map(x => `<button class="opt" data-i="${x[1]}">${x[0][0]}</button>`).join('')}</div>
      <div class="row"><button class="btn" id="cf" disabled>Confirmar decisión</button></div>`;
    const val = elegir($('#so'), $('#cf'));
    $('#cf').onclick = () => {
      const b = app.querySelector('#so .pick'), o = a.o[+val()];
      app.querySelectorAll('#al .opt').forEach(x => x.style.pointerEvents = 'none'); $('#cf').style.display = 'none';
      b.classList.add('sel');
      const antes = ventas; ventas += o[1]; sube(antes, ventas); sCash();
      if (o[2]) msg(m, 'ojo', `Ojo: ${o[2]}<br>Vendiste <b>${pesos(o[1])}</b>; con los datos pudiste vender <b>${pesos(a.o[0][1])}</b>.`);
      else msg(m, 'bien', `✅ ¡Decisión con datos! Vendiste <b>${pesos(o[1])}</b>.`);
      k++;
      m.innerHTML += `<div class="row"><button class="btn" id="nx">${k < A.length ? 'Siguiente alerta ➜' : 'Ver resultados ➜'}</button></div>`;
      $('#nx').onclick = () => k < A.length ? pinta() : resultado(A.reduce((s, x) => s + x.o[0][1], 0));
    };
  };
  pinta();
}

/* ---------- resultado ---------- */
function resultado(maximo) {
  clearInterval(tick); reloj(); etapa(6);
  const ojo = 3200000;
  const pct = Math.round(ventas / maximo * 100);
  app.innerHTML = `
  <section class="card">
    <h2>📈 Resultado del Black Friday</h2>
    <div class="cmp">
      <div class="r"><span>😵 Año pasado ("a ojo")</span><div class="t"><i style="background:#9CA3AF">${pesos(ojo)}</i></div></div>
      <div class="r"><span>🧠 Tú, con data warehouse</span><div class="t"><i style="background:var(--verde)">${pesos(ventas)}</i></div></div>
    </div>
    <p>Alcanzaste el <b>${pct}%</b> de las ventas posibles. ${pct === 100 ? '¡Decidiste todo con datos! 🏆' : 'Revisa las alertas donde decidiste sin mirar el tablero.'}</p>
    <div class="story" style="background:#EDE3FA;border-color:var(--morado)">El data warehouse no vendió por ti: <b>te dio la información a tiempo</b> para decidir mejor.</div>
    <div class="row"><button class="btn" id="nx">Ver mi certificado</button></div>
  </section>`;
  const top = Math.max(ojo, ventas);
  setTimeout(() => {
    const b = app.querySelectorAll('.cmp i');
    b[0].style.width = (ojo / top * 100) + '%'; b[1].style.width = (ventas / top * 100) + '%';
  }, 80);
  sWin(); confeti();
  $('#nx').onclick = certificado;
}

/* ---------- certificado ---------- */
function certificado() {
  const fecha = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const tiempo = fmt(segundos);
  const texto = `🛒 ${nombre} fue Director comercial por un día y vendió ${pesos(ventas)} en el Black Friday con su data warehouse, en ${tiempo}. Semana 3 · Tecnología de información aplicada a las empresas · UTEL`;
  const url = location.href;
  app.innerHTML = `
  <section class="card">
    <div class="cert">
      <div style="font-size:44px">🏆</div>
      <div class="mis" style="color:var(--verde-d)">Certificado</div>
      <h2>Director comercial por un día</h2>
      <p>Se otorga a</p>
      <div class="nm">${esc(nombre)}</div>
      <p>por construir el data warehouse de Súper Del Valle (extracción, elaboración, carga y explotación) y decidir con datos en el Black Friday.</p>
      <div class="meta"><span>💰 ${pesos(ventas)}</span><span>⏱️ ${tiempo}</span><span>📅 ${fecha}</span><span>Semana 3</span></div>
      <p style="margin-top:14px"><b>Docente: Dr. Armando Maravilla</b></p>
    </div>
    <div class="share">
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(texto + ' ' + url)}">WhatsApp</a>
      <a class="btn fb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
      <a class="btn xx" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(texto)}&url=${encodeURIComponent(url)}">X</a>
      <button class="btn cp" id="cp">Copiar</button>
      <button class="btn st" id="st">Imagen para historias</button>
    </div>
    <div class="chat">💬 Comparte en el chat tu certificado, tus ventas y tu tiempo</div>
    <div class="row" style="justify-content:center"><button class="btn sec" id="re">Jugar de nuevo</button></div>
  </section>`;
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(texto); $('#cp').textContent = '¡Copiado!'; } catch (e) { prompt('Copia este texto:', texto); } };
  $('#st').onclick = () => historia(tiempo, fecha);
  $('#re').onclick = () => location.reload();
}

function historia(tiempo, fecha) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1080, 1920); g.addColorStop(0, '#2B0F55'); g.addColorStop(1, '#0B5E1F');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100'];
  for (let i = 0; i < 90; i++) { x.fillStyle = cols[i % 6]; x.globalAlpha = .5; x.fillRect(Math.random() * 1080, Math.random() * 1920, 14, 6); }
  x.globalAlpha = 1;
  x.fillStyle = '#fff';
  if (x.roundRect) { x.beginPath(); x.roundRect(90, 360, 900, 1240, 50); x.fill(); } else x.fillRect(90, 360, 900, 1240);
  x.textAlign = 'center';
  x.font = '160px serif'; x.fillText('🏆', 540, 580);
  x.fillStyle = '#058A06'; x.font = '800 44px Poppins, sans-serif'; x.fillText('CERTIFICADO', 540, 680);
  x.fillStyle = '#1F2433'; x.font = '700 58px Poppins, sans-serif'; x.fillText('Director comercial', 540, 770); x.fillText('por un día', 540, 840);
  x.fillStyle = '#7B2FD0'; x.font = '800 64px Poppins, sans-serif';
  x.fillText(nombre.length > 22 ? nombre.slice(0, 22) + '…' : nombre, 540, 970);
  x.fillStyle = '#058A06'; x.font = '800 70px Poppins, sans-serif'; x.fillText(pesos(ventas), 540, 1090);
  x.fillStyle = '#1F2433'; x.font = '500 44px Poppins, sans-serif';
  x.fillText('vendidos en el Black Friday', 540, 1150);
  x.fillText('⏱️ ' + tiempo + '   ·   Semana 3', 540, 1240); x.fillText(fecha, 540, 1305);
  x.font = '700 40px Poppins, sans-serif'; x.fillText('Docente: Dr. Armando Maravilla', 540, 1400);
  x.fillStyle = '#fff'; x.font = '700 50px Poppins, sans-serif'; x.fillText('Data warehouse · UTEL', 540, 1720);
  const img = new Image(); img.onload = () => {
    x.drawImage(img, 540 - 180, 1430, 360, 144);
    const a = document.createElement('a'); a.download = 'certificado-semana3.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  img.src = document.querySelector('header img').src;
}

inicio();
</script>
